name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: 检出标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 校验标签版本
        run: test "${GITHUB_REF_NAME}" = "v$(node -p \"require('./package.json').version\")"
      - name: 测试并构建发布包
        run: npm run release:build
      - name: 上传 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "Agent Record ${GITHUB_REF_NAME}" --generate-notes
