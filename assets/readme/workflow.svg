<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Agent Record 工作流程</title>
  <desc id="desc">用户描述操作，AI 控制 Chrome，扩展记录画面和事件，Studio 整理镜头并导出 MP4。</desc>

  <rect width="1200" height="350" rx="26" fill="#111111"/>
  <text x="56" y="58" fill="#f2f1ec" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="36" font-weight="680">一句操作说明，变成一支成片。</text>
  <text x="1144" y="54" text-anchor="end" fill="#888680" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LOCAL PIPELINE</text>

  <g transform="translate(56 104)">
    <g id="prompt">
      <rect width="240" height="184" rx="18" fill="#f2f1ec"/>
      <text x="22" y="34" fill="#77746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">01 / PROMPT</text>
      <text x="22" y="78" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">告诉 AI</text>
      <text x="22" y="108" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">网址与操作目标</text>
      <path d="M22 142H158" stroke="#bbb8b0" stroke-width="2"/>
      <circle cx="170" cy="142" r="5" fill="#ff4d43"/>
    </g>

    <path d="M248 92H270" stroke="#77746d" stroke-width="2"/>
    <path d="M264 85L271 92L264 99" fill="none" stroke="#77746d" stroke-width="2"/>

    <g id="browser" transform="translate(278 0)">
      <rect width="240" height="184" rx="18" fill="#252525" stroke="#3b3b3b"/>
      <text x="22" y="34" fill="#9a9891" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">02 / BROWSER</text>
      <text x="22" y="78" fill="#f2f1ec" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">AI 自动操作</text>
      <text x="22" y="108" fill="#f2f1ec" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">真实 Chrome 页面</text>
      <rect x="22" y="136" width="196" height="25" rx="12.5" fill="#343434"/>
      <circle cx="38" cy="148.5" r="4" fill="#ff4d43"/>
      <text x="51" y="154" fill="#aaa8a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">github.com/…</text>
    </g>

    <path d="M526 92H548" stroke="#77746d" stroke-width="2"/>
    <path d="M542 85L549 92L542 99" fill="none" stroke="#77746d" stroke-width="2"/>

    <g id="record" transform="translate(556 0)">
      <rect width="240" height="184" rx="18" fill="#252525" stroke="#3b3b3b"/>
      <text x="22" y="34" fill="#9a9891" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">03 / RECORD</text>
      <text x="22" y="78" fill="#f2f1ec" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">扩展保存画面</text>
      <text x="22" y="108" fill="#f2f1ec" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">以及操作时间轴</text>
      <g transform="translate(22 138)">
        <circle cx="8" cy="8" r="8" fill="#ff4d43"/>
        <text x="28" y="14" fill="#aaa8a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mouse · click · input</text>
      </g>
    </g>

    <path d="M804 92H826" stroke="#77746d" stroke-width="2"/>
    <path d="M820 85L827 92L820 99" fill="none" stroke="#77746d" stroke-width="2"/>

    <g id="output" transform="translate(834 0)">
      <rect width="254" height="184" rx="18" fill="#f2f1ec"/>
      <text x="22" y="34" fill="#77746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">04 / OUTPUT</text>
      <text x="22" y="78" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">Studio 整理镜头</text>
      <text x="22" y="108" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="680">导出 2K60 MP4</text>
      <rect x="22" y="136" width="119" height="27" rx="13.5" fill="#111111"/>
      <text x="40" y="155" fill="#f2f1ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">demo.mp4</text>
    </g>
  </g>
</svg>
